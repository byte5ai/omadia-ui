<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>omadia UI: the agentic desktop (clickable mockup)</title>
<meta name="description" content="Clickable mockup: omadia UI as the desktop. The host OS only boots it; every application is generated on request and runs on omadia core with its plugins." />
<!--
  Clickable mockup, not an implementation. Shows omadia UI as the desktop shell
  of a thin client: applications are generated on request from primitives and
  Lumens (docs/lumens-spec.md), backed by omadia core and its plugins.
  Material: Lume, dark base, Lagoon palette (docs/visual-spec.md).
  Interaction model: direct manipulation, context-invoke action panel, beam,
  Cmd/Ctrl+K, Spaces, Trace (CONCEPT.md "Interaction Model").
  All data is fictional. All logic is illustrative and runs in this page.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2303121D%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%236FC8D6%27/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;450;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
<style>
:root{
  --canvas-top:#232631; --canvas-btm:#1B1D24;
  --surface-top:#2A2D38; --surface-btm:#23262F;
  --raised-top:#303440; --raised-btm:#292C37;
  --sunken-top:#1D1F26; --sunken-btm:#16181E;
  --t1:#EEEFF3; --t2:#B6B9C3; --t3:#888B95;
  --bst:rgba(255,255,255,0.06); --bsb:rgba(0,0,0,0.40);
  --bdt:rgba(255,255,255,0.10); --bdb:rgba(0,0,0,0.50);
  --accent:#6FC8D6; --accent-hover:#88D2DE; --accent-active:#A1DCE6;
  --accent-subtle:rgba(111,200,214,0.20); --accent-glow:rgba(111,200,214,0.32);
  --accent-glow-strong:rgba(111,200,214,0.48); --accent-glow-core:rgba(210,245,250,0.50);
  --on-accent:#0A2026;
  --loading:#3E414C; --loading-hi:#525561;
  --err:#E08577; --err-edge:#C5685A; --ok:#88C499; --warn:#D6B468;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
  --ease-s:cubic-bezier(0.22,0.61,0.36,1.00); --ease-e:cubic-bezier(0.40,0.00,0.20,1.00);
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --serif:'Source Serif 4',Charter,'Iowan Old Style',Georgia,serif;
  --c-jonas:#A495F2; --c-mira:#EE8FB0; --c-deniz:#C6D36B;
}
:root[data-palette="atelier"]{
  --accent:#E0A26B; --accent-hover:#E5B080; --accent-active:#EBBE93;
  --accent-subtle:rgba(224,162,107,0.18); --accent-glow:rgba(224,162,107,0.30);
  --accent-glow-strong:rgba(224,162,107,0.46); --accent-glow-core:rgba(250,228,200,0.45);
  --on-accent:#2A1806;
}
:root[data-palette="petrol"]{
  --accent:#52B0E2; --accent-hover:#74C0E8; --accent-active:#90CFEE;
  --accent-subtle:rgba(82,176,226,0.16); --accent-glow:rgba(82,176,226,0.28);
  --accent-glow-strong:rgba(82,176,226,0.44); --accent-glow-core:rgba(197,229,245,0.45);
  --on-accent:#06192A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--t1);background:#0B0C10;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
.mono{font-family:var(--mono);font-weight:450;font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.palette-fade *{transition:color .2s var(--ease-s),background-color .2s var(--ease-s),border-color .2s var(--ease-s),box-shadow .2s var(--ease-s),fill .2s,stroke .2s}

/* ---------- Boot (thin client) ---------- */
#boot{position:fixed;inset:0;z-index:100;background:#08090C;display:grid;place-items:center;cursor:pointer}
#boot .log{position:absolute;left:32px;top:28px;font:450 12.5px/1.75 var(--mono);color:#7d808a;white-space:pre}
#boot .log b{color:#88C499;font-weight:450}
#boot .mark{font-family:'Days One',var(--sans);font-size:56px;color:#fff;opacity:0;transform:scale(1.03);filter:blur(3px);
  text-shadow:0 0 18px rgba(210,245,250,.35),0 0 60px rgba(111,200,214,.35);transition:all .8s var(--ease-e)}
#boot .mark.on{opacity:1;transform:none;filter:none}
#boot .arc{position:absolute;width:520px;height:520px;border-radius:50%;opacity:0;
  background:radial-gradient(closest-side,rgba(111,200,214,.18),transparent 70%);transition:opacity 1s}
#boot .arc.on{opacity:1}
#boot .skip{position:absolute;right:24px;bottom:20px;font-size:12px;color:#6b6e78}
#boot.done{opacity:0;transition:opacity .45s var(--ease-s);pointer-events:none}

/* ---------- Shell ---------- */
#shell{position:fixed;inset:0;display:grid;grid-template-rows:42px 1fr;
  background:linear-gradient(180deg,var(--canvas-top) 0%,var(--canvas-btm) 100%)}
.topbar{display:grid;grid-template-columns:minmax(150px,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 12px;
  background:linear-gradient(180deg,var(--sunken-top),var(--sunken-btm));border-bottom:1px solid var(--bsb);position:relative;z-index:20}
.wordmark{font-family:'Days One',var(--sans);font-size:17px;color:#fff;letter-spacing:.01em;
  text-shadow:0 0 10px rgba(210,245,250,.18);display:flex;align-items:center;gap:10px}
.wordmark small{font-family:var(--sans);font-size:11.5px;color:var(--t3);font-weight:500;letter-spacing:0}
.spaces{display:flex;gap:4px;align-items:center}
.space{height:28px;padding:0 6px 0 12px;border-radius:var(--r-pill);color:var(--t2);display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.space:hover{background:var(--accent-subtle);color:var(--t1)}
.space.is-home{padding-right:12px}
.space.active{color:var(--t1);background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));
  border-color:var(--bdb);border-top-color:var(--bdt);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 0 4px var(--accent-glow-core),0 3px 10px var(--accent-glow)}
.space .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent-glow-strong)}
.space .x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--t3);font-size:13px;line-height:1}
.space .x:hover{background:rgba(255,255,255,.08);color:var(--t1)}
.tray{justify-self:end;display:flex;align-items:center;gap:6px;min-width:0}
@media (max-width:1560px){.core span{display:none}}
@media (max-width:1320px){#btn-cmdk .lbl{display:none}}
.tbtn{white-space:nowrap;height:28px;padding:0 10px;border-radius:var(--r-sm);color:var(--t2);font-size:12.5px;font-weight:500;border:1px solid transparent;display:flex;align-items:center;gap:6px}
.tbtn:hover{background:var(--accent-subtle);color:var(--t1)}
.tbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-subtle);background:rgba(111,200,214,.06)}
.kbd{font:500 11px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid var(--bdb);border-top-color:var(--bdt);color:var(--t3)}
.core{white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);padding:0 8px}
.core i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(136,196,153,.6)}
.clock{font:450 12.5px var(--mono);color:var(--t2);padding:0 6px}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt)}

#stage{position:relative;overflow:hidden}
.canvas{position:absolute;inset:0;padding:14px 14px 48px;display:none}
.canvas.on{display:block}
.canvas.enter-r{animation:enterR .32s var(--ease-s) both}
.canvas.enter-l{animation:enterL .32s var(--ease-s) both}
.canvas.leave-l{display:block;animation:leaveL .32s var(--ease-s) both;pointer-events:none}
.canvas.leave-r{display:block;animation:leaveR .32s var(--ease-s) both;pointer-events:none}
@keyframes enterR{from{opacity:0;transform:translateX(4px)}to{opacity:1;transform:none}}
@keyframes enterL{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
@keyframes leaveL{to{opacity:0;transform:translateX(-4px)}}
@keyframes leaveR{to{opacity:0;transform:translateX(4px)}}

/* status + trace launcher */
#status{position:absolute;left:16px;bottom:12px;z-index:15;max-width:min(760px,62vw);font-size:12.5px;color:var(--t3);
  display:flex;align-items:center;gap:8px;min-height:24px}
#status b{color:var(--t1);font-weight:500}
#status .sdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 6px var(--accent-glow-strong)}
.corner{position:absolute;right:14px;bottom:10px;z-index:15;display:flex;gap:6px}

/* ---------- Lume primitives ---------- */
.pane{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--surface-top) 0%,var(--surface-btm) 100%);
  border:1px solid var(--bdb);border-top-color:var(--bdt);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bsb);min-height:44px}
.pane-h h3{font-size:13px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.pane-h .sub{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pane-b{flex:1;min-height:0;overflow:auto;position:relative}
.btn{text-decoration:none;height:32px;padding:0 13px;border-radius:var(--r-sm);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset;color:var(--t1);transition:box-shadow .1s,border-color .1s}
.btn:hover{border-color:var(--accent-subtle);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 0 4px var(--accent-glow-core),0 4px 12px var(--accent-glow)}
.btn.primary{background:linear-gradient(180deg,var(--accent-active),var(--accent));color:var(--on-accent);border-color:transparent;font-weight:600;
  box-shadow:0 0 4px var(--accent-glow-core),0 4px 12px var(--accent-glow)}
.btn.primary:hover{box-shadow:0 0 6px var(--accent-glow-core),0 6px 18px var(--accent-glow-strong)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--t2)}
.btn.ghost:hover{background:var(--accent-subtle);color:var(--t1)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.icon{width:26px;padding:0;justify-content:center}
.seg{display:inline-flex;padding:2px;border-radius:var(--r-md);background:linear-gradient(180deg,var(--sunken-top),var(--sunken-btm));border:1px solid var(--bsb)}
.seg button{height:26px;padding:0 9px;border-radius:var(--r-sm);font-size:12.5px;color:var(--t2);font-weight:500}
.seg button[aria-pressed="true"]{color:var(--t1);background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 0 0 1px var(--accent-subtle)}
.toggle{width:34px;height:20px;border-radius:var(--r-pill);background:var(--sunken-btm);border:1px solid var(--bsb);position:relative;flex:none}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--t3);transition:all .15s var(--ease-s)}
.toggle[aria-pressed="true"]{background:var(--accent-subtle);border-color:var(--accent)}
.toggle[aria-pressed="true"]::after{left:16px;background:var(--accent);box-shadow:0 0 6px var(--accent-glow-strong)}

/* condensation (visual-spec 3.5) */
.pane.pre{background:linear-gradient(180deg,var(--surface-top),var(--surface-btm))}
.pane.pre > *{visibility:hidden}
.pane.pre::before{content:'';position:absolute;inset:14px;border-radius:var(--r-md);
  background:linear-gradient(90deg,var(--loading) 0%,var(--loading-hi) 50%,var(--loading) 100%);background-size:200% 100%;
  opacity:.35;animation:skel 1.4s linear infinite}
@keyframes skel{from{background-position:100% 0}to{background-position:-100% 0}}
.condense{animation:condense .8s var(--ease-e) both}
.condense::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:6;
  background:radial-gradient(closest-side,var(--accent-glow-strong),transparent);animation:bloom .8s var(--ease-e) both}
.condense::after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:1px;background:var(--accent);pointer-events:none;z-index:6;
  box-shadow:0 0 8px var(--accent-glow-strong);transform-origin:left;animation:sweep .8s var(--ease-s) both}
@keyframes condense{0%{opacity:0;transform:scale(1.03);filter:blur(2px)}40%{opacity:.92;filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes bloom{0%{opacity:.9;transform:scale(1.2)}100%{opacity:0;transform:scale(.5)}}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}62%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.patch{animation:patch .8s var(--ease-e)}
@keyframes patch{0%{opacity:.2;filter:blur(2px);box-shadow:0 0 0 1px var(--accent),0 0 18px var(--accent-glow-strong)}40%{opacity:1;filter:none}100%{box-shadow:0 0 0 0 transparent}}
.ctx-target{box-shadow:0 0 0 1px var(--accent),0 0 6px var(--accent-glow-core),0 6px 18px var(--accent-glow-strong)!important;border-radius:var(--r-md)}
.beaming{animation:beamPulse 1s ease-in-out infinite}
@keyframes beamPulse{0%,100%{box-shadow:0 0 0 1px var(--accent),0 0 6px var(--accent-glow-core)}50%{box-shadow:0 0 0 1px var(--accent),0 0 14px var(--accent-glow-core),0 8px 26px var(--accent-glow-strong)}}

/* ---------- Home ---------- */
.home{height:100%;display:grid;grid-template-rows:1fr auto auto;gap:14px;max-width:1080px;margin:0 auto}
.home-center{position:relative;align-self:center;justify-self:center;width:min(720px,100%);text-align:center;display:flex;flex-direction:column;gap:16px;padding-top:12px}
.greet{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.01em}
.brief{font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--t2);max-width:56ch;margin:0 auto}
.cold{display:flex;align-items:center;gap:8px;height:54px;padding:0 8px 0 18px;border-radius:var(--r-lg);margin-top:6px;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 0 0 4px var(--accent-glow),0 0 16px var(--accent-glow-core),0 12px 40px var(--accent-glow-strong)}
.cold input{flex:1;height:100%;background:none;border:none;outline:none;font-size:16px}
.cold input::placeholder{color:var(--t3)}
.cold .go{width:38px;height:38px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--on-accent);background:linear-gradient(180deg,var(--accent-active),var(--accent))}
.cold-hint{min-height:20px;font-size:12.5px;color:var(--warn)}
.sugg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
.chip{padding:12px 14px;border-radius:var(--r-md);display:flex;flex-direction:column;gap:4px;min-height:84px;
  background:linear-gradient(180deg,var(--surface-top),var(--surface-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset;transition:box-shadow .12s,border-color .12s,transform .12s}
.chip:hover{border-color:var(--accent);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 0 4px var(--accent-glow-core),0 4px 14px var(--accent-glow)}
.chip:active{transform:translateY(1px)}
.chip b{font-size:13.5px;font-weight:500;line-height:1.4}
.chip span{font-size:11.5px;color:var(--t3)}
.tools .pane-b{padding:12px 14px;overflow:visible}
.tool-grid{display:flex;gap:10px;flex-wrap:wrap}
.tool{width:220px;padding:12px;border-radius:var(--r-md);text-align:left;display:flex;gap:12px;align-items:center;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.tool:hover{border-color:var(--accent);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 0 4px var(--accent-glow-core),0 4px 12px var(--accent-glow)}
.tool .glyph{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--accent);flex:none;
  background:radial-gradient(circle,var(--accent-subtle) 0%,var(--accent-subtle) 40%,rgba(210,245,250,.18) 80%,transparent 100%)}
.tool b{display:block;font-size:13px;font-weight:600}
.tool span{font-size:11.5px;color:var(--t3)}
.empty{font-size:12.5px;color:var(--t3)}
.systems{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--t3);padding:0 4px}
.systems .sys{display:flex;align-items:center;gap:6px;color:var(--t2)}
.systems .sys i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.systems .host{margin-left:auto}

/* ---------- Generation overlay ---------- */
.genlog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;width:min(560px,90%);padding:20px 22px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);
  box-shadow:0 4px 16px rgba(0,0,0,.55),0 24px 48px rgba(0,0,0,.65),0 0 32px var(--accent-glow-core),0 0 96px var(--accent-glow);transition:opacity .3s,transform .3s}
.genlog.out{opacity:0;transform:translate(-50%,-48%) scale(.98)}
.genlog .q{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--t1);margin:6px 0 14px}
.genlog ol{list-style:none;display:flex;flex-direction:column;gap:6px}
.genlog li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:baseline;font-size:12.5px;color:var(--t2);animation:condense .5s var(--ease-e) both}
.genlog li .tag{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.genlog li .st{font:450 11.5px var(--mono);color:var(--t3)}
.genlog li.done .st{color:var(--ok)}
.genlog li:not(.done) .st::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:4px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- App shells ---------- */
.app{height:100%;display:grid;gap:12px;min-height:0}
.apphead{flex-direction:row;align-items:center;gap:18px;padding:10px 14px;flex-wrap:nowrap}
.apphead .title{display:flex;flex-direction:column;min-width:0}
.apphead .title b{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.apphead .title span{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apphead .grow{flex:1}
.kpis{display:flex;gap:20px;padding:0 6px}
.kpi{display:flex;flex-direction:column;line-height:1.2}
.kpi .v{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--t3)}
.kpi.warn .v{color:var(--warn)} .kpi.good .v{color:var(--ok)}
.gen-note{font-size:11.5px;color:var(--t3)}

/* Dispatch */
.app.dispatch{grid-template-rows:auto minmax(0,1fr) auto}
.dmid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;min-height:0}
.queue-list{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:100%}
.queue-list.drop-on{outline:1.5px dashed var(--accent);outline-offset:-4px;border-radius:var(--r-md)}
.order{padding:10px 12px;border-radius:var(--r-md);user-select:none;touch-action:none;cursor:grab;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bsb);border-top-color:var(--bst);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.order:hover{border-color:var(--accent-subtle)}
.order.sel{border-color:var(--accent);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 0 4px var(--accent-glow-core),0 4px 12px var(--accent-glow)}
.order .r1{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t3)}
.order .prio{font-weight:600}
.prio.high{color:var(--warn)} .prio.low{color:var(--t3)} .prio.normal{color:var(--t2)}
.order .cust{font-size:13.5px;font-weight:600;margin-top:2px}
.order .task{font-size:12.5px;color:var(--t2)}
.order .r3{display:flex;gap:10px;font-size:11.5px;color:var(--t3);margin-top:4px}
.queue-empty{font-family:var(--serif);font-size:14px;color:var(--t2);padding:18px 8px;text-align:center}
.mapwrap{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:0 0 var(--r-lg) var(--r-lg)}
.mapwrap svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.mapwrap svg.panning{cursor:grabbing}
.pin{cursor:pointer}
.pin circle.ring{transition:r .15s}
.callout{position:absolute;pointer-events:none;padding:8px 10px;border-radius:var(--r-md);font-size:12px;white-space:nowrap;transform:translate(-50%,calc(-100% - 18px));
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);box-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.45)}
.callout b{display:block;font-size:12.5px}
.callout span{color:var(--t3)}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:12px;font-size:11.5px;color:var(--t2);pointer-events:none}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.timeline .pane-b{overflow:visible}
.axis{display:grid;grid-template-columns:230px 1fr;padding:6px 14px 0}
.axis .hours{position:relative;height:18px}
.axis .hours span{position:absolute;transform:translateX(-50%);font:450 11px var(--mono);color:var(--t3)}
.lanes{display:flex;flex-direction:column;padding:4px 14px 12px;gap:6px}
.lane{display:grid;grid-template-columns:230px 1fr;align-items:stretch;border-radius:var(--r-md)}
.lane-h{display:flex;align-items:center;gap:10px;padding-right:12px;cursor:context-menu;border-radius:var(--r-md)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;color:#15161b;background:var(--c)}
.lane-h .who{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.lane-h .who b{font-size:13px;font-weight:600}
.lane-h .who span{font-size:11px;color:var(--t3)}
.load{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font:450 11.5px var(--mono);color:var(--t2)}
.load .bar{width:54px;height:4px;border-radius:2px;background:var(--sunken-btm);overflow:hidden}
.load .bar i{display:block;height:100%;background:var(--c)}
.load.over{color:var(--warn)}
.track{position:relative;height:50px;border-radius:var(--r-md);background:linear-gradient(180deg,var(--sunken-top),var(--sunken-btm));border:1px solid var(--bsb);overflow:hidden}
.lane.collapsed .track{height:22px}
.lane.collapsed .job .t2{display:none}
.track.drop-on{outline:1.5px dashed var(--accent);outline-offset:-1px}
.track .grid{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.04)}
.track .ot{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,rgba(214,180,104,.07) 0 6px,transparent 6px 12px);border-left:1px dashed rgba(214,180,104,.45)}
.track .ot span{position:absolute;right:6px;top:3px;font-size:10px;color:var(--warn);opacity:.8}
.travel{position:absolute;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 8px);opacity:.6}
.job{position:absolute;top:5px;bottom:5px;border-radius:var(--r-sm);padding:4px 8px;overflow:hidden;cursor:grab;user-select:none;touch-action:none;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bsb);border-left:3px solid var(--c);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.job .t1{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .t2{font:450 10.5px var(--mono);color:var(--t3);white-space:nowrap}
.job.sel{box-shadow:0 0 0 1px var(--accent),0 0 4px var(--accent-glow-core),0 4px 12px var(--accent-glow)}
.job.mismatch{border-color:var(--err-edge);border-left-color:var(--c)}
.job.mismatch .t2{color:var(--err)}
.lane.dim{opacity:.55}
.dragghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;opacity:.85;padding:8px 12px;border-radius:var(--r-md);font-size:12.5px;font-weight:600;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.55)}
.dragghost span{display:block;font:450 11px var(--mono);color:var(--t3)}
.dragging, .dragging *{cursor:grabbing!important}

/* Solar */
.app.solar{grid-template-rows:auto minmax(0,1fr)}
.smain{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr) 250px;gap:12px;min-height:0}
.roof{grid-column:1;grid-row:1}
.sbottom{grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;min-height:0}
.config{grid-column:2;grid-row:1 / span 2}
.roofwrap{flex:1;min-height:0;position:relative}
.roofwrap svg{display:block;width:100%;height:100%;touch-action:none}
.cell{cursor:crosshair}
.cell:hover .hov{stroke:var(--accent);stroke-width:1.5;filter:drop-shadow(0 0 4px var(--accent-glow-strong))}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:14px;border-bottom:1px solid var(--bsb)}
.metric .v{font:600 20px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.metric .v small{font-size:12px;color:var(--t3);font-weight:450;margin-left:3px}
.metric .l{font-size:11px;color:var(--t3)}
.cfg{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.cfg .row{display:flex;flex-direction:column;gap:7px}
.cfg .row.inline{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.cfg .row.inline .lbl{display:flex;flex-direction:column}
.cfg .row.inline .lbl span{font-size:11.5px;color:var(--t3)}
.cfg label.h{font-size:12px;font-weight:600;color:var(--t2)}
.mods{display:flex;flex-direction:column;gap:6px}
.mod{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:9px 11px;border-radius:var(--r-md);
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bsb);border-top-color:var(--bst)}
.mod b{font-size:13px;font-weight:600} .mod .p{font:450 12px var(--mono);color:var(--t2);text-align:right}
.mod span:not(.p){font-size:11.5px;color:var(--t3);grid-column:1 / -1}
.mod[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 4px var(--accent-glow-core),0 4px 12px var(--accent-glow)}
table.q{width:100%;border-collapse:collapse;font-size:12.5px}
table.q th{font-size:11px;font-weight:600;color:var(--t3);text-align:left;padding:7px 10px;border-bottom:1px solid var(--bsb);position:sticky;top:0;background:var(--surface-top)}
table.q td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.035)}
table.q td.n, table.q th.n{text-align:right;font-family:var(--mono);font-weight:450;font-variant-numeric:tabular-nums}
table.q tr.sum td{font-weight:600;border-bottom:none;color:var(--t1)}
table.q tr.sum.first td{border-top:1px solid var(--bdb)}
table.q tr.disc td{color:var(--ok)}
.chartwrap{flex:1;min-height:0;padding:8px 12px 10px}
.chartwrap svg{display:block;width:100%;height:100%}

/* Kiosk */
.app.kiosk{grid-template-rows:auto minmax(0,1fr)}
.kframe{flex:1;border:0;width:100%;height:100%;border-radius:0 0 var(--r-lg) var(--r-lg);background:#1B1D24}

/* ---------- Overlays ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,24,30,.6);animation:fade .2s var(--ease-e) both}
@keyframes fade{from{opacity:0}}
#panel{position:fixed;z-index:70;width:330px;border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 16px rgba(0,0,0,.55),0 18px 40px rgba(0,0,0,.55),0 0 24px var(--accent-glow);animation:pop .2s var(--ease-e) both}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
#panel .ph{padding:12px 14px 10px;border-bottom:1px solid var(--bsb)}
#panel .ph b{display:block;font-size:13.5px;font-weight:600}
#panel .ph span{font-size:11.5px;color:var(--t3)}
#panel .zone{padding:8px 6px;border-bottom:1px solid var(--bsb)}
#panel .zone .eyebrow{padding:2px 8px 6px;display:flex;justify-content:space-between}
#panel .zone .eyebrow em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
#panel .act{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px;border-radius:var(--r-sm);text-align:left;font-size:13px}
#panel .act:hover{background:var(--accent-subtle)}
#panel .act .fx{font-size:11px;color:var(--t3);white-space:nowrap}
#panel .act .fx.ext{color:var(--warn)}
#panel .beam{display:flex;gap:6px;padding:10px 10px 4px}
#panel .bhint{display:block;padding:0 12px 10px;font-size:11.5px;color:var(--t3);text-align:left}
#panel .bhint:hover{color:var(--accent)}
#panel .beam input{flex:1;height:32px;padding:0 10px;border-radius:var(--r-sm);outline:none;font-size:13px;
  background:linear-gradient(180deg,var(--sunken-top),var(--sunken-btm));border:1px solid var(--bsb)}
#panel .beam input:focus{border-color:var(--accent);box-shadow:0 0 6px var(--accent-glow-core),0 6px 18px var(--accent-glow-strong)}
.beamchip{position:fixed;z-index:65;padding:5px 10px;border-radius:var(--r-pill);font-size:12px;pointer-events:none;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--accent);box-shadow:0 0 6px var(--accent-glow-core),0 4px 12px var(--accent-glow)}
#modal{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,92vw);border-radius:var(--r-lg);padding:22px;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);
  box-shadow:0 4px 16px rgba(0,0,0,.55),0 24px 48px rgba(0,0,0,.65),0 0 32px var(--accent-glow-core),0 0 96px var(--accent-glow);animation:modalIn .2s var(--ease-e) both}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-50%) scale(.97)}}
#modal h2{font-size:18px;font-weight:600;margin:6px 0 8px;letter-spacing:-.01em}
#modal p{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--t2)}
#modal ul{margin:12px 0 4px;padding-left:18px;color:var(--t2);font-size:13px;display:flex;flex-direction:column;gap:4px}
#modal .eyebrow{color:var(--warn)}
#modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#cmdk{position:fixed;z-index:80;left:50%;top:14vh;transform:translateX(-50%);width:min(620px,92vw);border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);
  box-shadow:0 0 0 4px var(--accent-glow),0 0 16px var(--accent-glow-core),0 12px 40px var(--accent-glow-strong);animation:pop .2s var(--ease-e) both}
#cmdk input{width:100%;height:54px;padding:0 18px;background:none;border:none;outline:none;font-size:16px;border-bottom:1px solid var(--bsb)}
#cmdk ul{list-style:none;padding:6px;max-height:50vh;overflow:auto}
#cmdk li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:var(--r-sm);font-size:13.5px;cursor:pointer}
#cmdk li span{font-size:11.5px;color:var(--t3)}
#cmdk li.on{background:var(--accent-subtle)}
#trace{position:fixed;z-index:50;right:14px;top:56px;bottom:52px;width:340px;display:flex;flex-direction:column;border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--surface-top),var(--surface-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.45);animation:pop .2s var(--ease-e) both}
#trace ol{list-style:none;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:10px}
#trace li{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:12.5px;color:var(--t2)}
#trace li .tm{font:450 11px var(--mono);color:var(--t3);padding-top:2px}
#trace li b.k{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
#trace li b:not(.k){color:var(--t1);font-weight:500}
#guide{position:fixed;z-index:55;right:14px;top:56px;width:350px;padding:16px 18px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--raised-top),var(--raised-btm));border:1px solid var(--bdb);border-top-color:var(--bdt);
  box-shadow:0 4px 16px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.5),0 0 24px var(--accent-glow);animation:pop .25s var(--ease-e) both}
#guide p{font-family:var(--serif);font-size:14.5px;line-height:1.55;color:var(--t2);margin:6px 0 10px}
#guide ol{padding-left:18px;font-size:13px;color:var(--t2);display:flex;flex-direction:column;gap:5px}
#guide ol b{color:var(--t1);font-weight:500}
#guide .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}

/* ---------- X-ray ---------- */
.xr{display:none}
body.xray .xr{display:block;position:absolute;z-index:8;pointer-events:none;left:10px;bottom:10px;max-width:300px;padding:8px 10px;border-radius:var(--r-md);
  font:450 11px/1.55 var(--mono);color:var(--t1);background:rgba(10,14,18,.86);border:1px dashed var(--accent);box-shadow:0 0 12px var(--accent-glow)}
body.xray .xr b{color:var(--accent);font-weight:600}
body.xray .xr.tr{left:auto;right:10px;bottom:auto;top:52px}
body.xray .pane{outline:1.5px dashed rgba(111,200,214,.45);outline-offset:-1px}
#xbar{display:none}
body.xray #xbar{display:block;position:absolute;left:50%;transform:translateX(-50%);bottom:44px;z-index:16;width:min(820px,92%);padding:10px 14px;border-radius:var(--r-md);
  font-size:12.5px;line-height:1.55;color:var(--t1);background:rgba(10,14,18,.92);border:1px solid var(--accent);box-shadow:0 0 16px var(--accent-glow)}
#xbar b{color:var(--accent);font-weight:600}

@media (max-width:1180px){
  .dmid{grid-template-columns:240px minmax(0,1fr)}
  .smain{grid-template-columns:minmax(0,1fr) 300px}
  .kpis{gap:12px} .gen-note{display:none}
}
@media (max-width:900px){
  body{overflow:auto}
  .sugg{grid-template-columns:1fr}
  .wordmark small,.core span,.clock{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .condense::before,.condense::after{display:none}
}

<body>

<div id="boot" role="status" aria-label="Booting">
  <div class="log" id="bootlog"></div>
  <div class="arc" id="bootarc"></div>
  <div class="mark" id="bootmark">omadia</div>
  <div class="skip">Click to skip</div>
</div>

<div id="shell" aria-hidden="true">
  <header class="topbar">
    <div class="wordmark">omadia <small>UI</small></div>
    <nav class="spaces" id="spaces" aria-label="Spaces"></nav>
    <div class="tray">
      <button class="tbtn" id="btn-cmdk" title="Ask omadia or run a command"><span class="lbl">Ask or run</span> <span class="kbd" id="kbd">Ctrl K</span></button>
      <button class="tbtn" id="btn-xray" aria-pressed="false" title="Show what this canvas is made of">X-ray</button>
      <button class="tbtn" id="btn-guide" title="About this mockup">?</button>
      <div class="core" title="omadia core connection"><i></i><span>omadia core, 34 plugins</span></div>
      <div class="clock" id="clock">--:--</div>
      <div class="avatar" title="Lea Sommer">LS</div>
    </div>
  </header>
  <main id="stage">
    <section class="canvas on" data-space="home" id="cv-home"></section>
    <div id="status"><span class="sdot"></span><span id="status-t">Canvas ready.</span></div>
    <div id="xbar"></div>
    <div class="corner">
      <button class="tbtn" id="btn-trace" aria-pressed="false">Trace</button>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';
/* =========================================================================
   Utilities
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = (ms) => new Promise((r) => setTimeout(r, RM ? Math.min(ms, 60) : ms));
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hm = (t) => { const m = Math.round(t * 60); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const eur = (n) => '€' + Math.round(n).toLocaleString('en-US');
const num = (n, d = 0) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
function flash(node, cls = 'patch') {
  if (!node) return;
  node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls);
  node.addEventListener('animationend', () => node.classList.remove(cls), { once: true });
}
$('#kbd').textContent = isMac ? '⌘K' : 'Ctrl K';
setInterval(() => { $('#clock').textContent = nowHM(); }, 1000); $('#clock').textContent = nowHM();

/* =========================================================================
   Status line + Trace
   ========================================================================= */
function status(html) { const s = $('#status'); $('#status-t').innerHTML = html; flash(s); }
const TRACE = [];
function trace(kind, text) { TRACE.unshift({ t: nowHM(), kind, text }); if ($('#trace')) renderTrace(); }
function renderTrace() {
  const t = $('#trace'); if (!t) return;
  t.querySelector('ol').innerHTML = TRACE.length ? TRACE.map((e) =>
    `<li><span class="tm">${e.t}</span><div><b class="k">${esc(e.kind)}</b>${e.text}</div></li>`).join('')
    : '<li><span class="tm"></span><div>Nothing yet. Prompts, beams, actions and external effects land here.</div></li>';
}
function toggleTrace(force) {
  const open = force ?? !$('#trace');
  $('#btn-trace').setAttribute('aria-pressed', String(open));
  if (!open) { $('#trace')?.remove(); return; }
  if ($('#trace')) return;
  closeGuide();
  document.body.appendChild(el(`<aside id="trace"><div class="pane-h"><h3>Trace</h3><span class="sub">what you asked, what omadia did</span></div><ol></ol></aside>`));
  renderTrace();
}
$('#btn-trace').onclick = () => toggleTrace();

/* =========================================================================
   Palette (Lume: one accent slot, three palettes, set conversationally)
   ========================================================================= */
function setPalette(p, said) {
  document.body.classList.add('palette-fade');
  document.documentElement.dataset.palette = p;
  setTimeout(() => document.body.classList.remove('palette-fade'), 260);
  const name = { lagoon: 'Lagoon', atelier: 'Atelier', petrol: 'Petrol' }[p];
  trace('Preference', `${esc(said)}: palette set to ${name} for this user.`);
  status(`Palette <b>${name}</b>. Stored as your preference, every canvas follows.`);
}

/* =========================================================================
   Spaces (one canvas per task, persistent)
   ========================================================================= */
const S = { space: 'home', order: ['home'], built: {}, pinned: {}, xray: false };
const META = {
  home: { label: 'Home' },

/* ---- pointer: select, drag (move > 6 px), long-press (400 ms), pan ---- */
function wireDispatchPointer(cv) {
  cv.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const item = e.target.closest('[data-order]');
    if (item) return startOrderGesture(e, item);
    const svg = e.target.closest('#d-map');
    if (svg) return startPan(e, svg);
  });
  cv.addEventListener('mouseover', (e) => { if (document.body.classList.contains('dragging')) return; const h = e.target.closest('.lane-h'); const f = h ? h.dataset.tech : null; if (f !== D.focus) { D.focus = f; dispatchRender(); } });
  cv.addEventListener('mouseleave', () => { if (D.focus) { D.focus = null; dispatchRender(); } });
  $('#d-mapwrap', cv).addEventListener('wheel', (e) => {
    e.preventDefault(); const svg = $('#d-map'); const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse()); zoomMap(e.deltaY > 0 ? 1.12 : 0.89, p.x, p.y);
  }, { passive: false });
}
function startPan(e, svg) {
  const sx = e.clientX, sy = e.clientY, v0 = { ...D.vb }; let moved = false;
  const lp = setTimeout(() => { if (!moved) { cleanup(); openPanel($('[data-ctx="map"]')); } }, 400);
  const scale = v0.w / svg.getBoundingClientRect().width;
  const move = (ev) => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!moved && Math.hypot(dx, dy) > 6) { moved = true; clearTimeout(lp); svg.classList.add('panning'); }
    if (moved) { D.vb = { ...v0, x: v0.x - dx * scale, y: v0.y - dy * scale }; applyVB(); }
  };
  const up = () => { clearTimeout(lp); cleanup(); if (!moved && D.sel) { D.sel = null; dispatchRender(); } };
  function cleanup() { svg.classList.remove('panning'); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}
function startOrderGesture(e, item) {
  e.preventDefault();
  const id = item.dataset.order, sx = e.clientX, sy = e.clientY; let dragging = false, ghost = null, hover = null, lpFired = false;
  const lp = setTimeout(() => { if (!dragging) { lpFired = true; cleanup(); openPanel(item); } }, 400);
  const move = (ev) => {
    if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) {
      clearTimeout(lp); dragging = true; closePanel();
      ghost = el(`<div class="dragghost">${esc(ORD[id].cust)}<span>SO-${id}, ${num(ORD[id].dur, 1)} h, ${SKILL[ORD[id].skill]}</span></div>`);
      document.body.appendChild(ghost); document.body.classList.add('dragging');
    }
    if (dragging) {
      ghost.style.transform = `translate(${ev.clientX + 12}px, ${ev.clientY + 10}px)`;
      const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-drop]');
      if (t !== hover) { hover?.classList.remove('drop-on'); hover = t; hover?.classList.add('drop-on'); }
    }
  };
  const up = (ev) => {
    clearTimeout(lp); cleanup();
    if (lpFired) return;
    if (!dragging) { D.sel = D.sel === id ? null : id; dispatchRender(); if (D.sel) status(`Selected <b>${esc(ORD[id].cust)}</b>. Queue, map and timeline follow the same selection, right here on the device.`); return; }
    ghost.remove(); document.body.classList.remove('dragging'); hover?.classList.remove('drop-on');
    if (!hover) return;
    const target = hover.dataset.drop;
    if (target === 'queue') { if (laneOf(id)) { unassign(id); D.sel = id; dispatchRender(); status(`<b>${esc(ORD[id].cust)}</b> is open again.`); trace('Direct', `Unassigned ${esc(ORD[id].cust)}.`); } return; }
    const tid = target.split(':')[1];
    const jobs = $$('.job', hover).filter((j) => j.dataset.order !== id);
    const idx = jobs.filter((j) => { const r = j.getBoundingClientRect(); return r.left + r.width / 2 < ev.clientX; }).length;
    const prev = laneOf(id); assign(id, tid, idx); D.sel = id; dispatchRender();
    const s = sched(tid); const st = s.stops.find((x) => x.id === id); const mism = !TECH[tid].skills.includes(ORD[id].skill);
    status(`${esc(ORD[id].cust)} to <b>${TECH[tid].name.split(' ')[0]}</b>, arrives ${hm(st.arrive)}.${mism ? ` <span style="color:var(--err)">${TECH[tid].name.split(' ')[0]} lacks ${SKILL[ORD[id].skill]} skills.</span>` : ''}${s.overtime > 0.05 ? ` Back at ${hm(s.finish)}, ${num(s.overtime, 1)} h overtime.` : ''}`);
    trace('Direct', `${esc(ORD[id].cust)} ${prev ? 'moved' : 'assigned'} to ${TECH[tid].name}.`);
  };
  function cleanup() { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}

  const ratio = 0.55 + BATT[P.battery].boost + (P.wallbox ? 0.03 : 0);
  const self = Math.min(yieldK * ratio, CONS * 0.8), exp = yieldK - self;
  const save = self * 0.29 + exp * 0.078;

    lines.push([inv[0], 1, inv[1]]);
  }
  if (BATT[P.battery].kwh) lines.push([`Battery storage ${BATT[P.battery].name}`, 1, BATT[P.battery].price]);
  if (P.wallbox) lines.push(['Wallbox 11 kW, load management', 1, 1150]);
  if (n) { lines.push(['Installation and commissioning', 1, 2800]); lines.push(['Scaffolding', 1, 950]); }

}

function wireRoofPointer(svg) {

    if (e.button !== 0) return;
    const cell = e.target.closest('[data-cell]'); if (!cell) return;

    const sugg = [{ label: `Optimise ${first(id)}’s route`, run: () => { const sv = optimise(id); dispatchRender(); status(sv > 0.5 ? `${first(id)} drives <b>${num(sv)} km</b> less, back at ${hm(sched(id).finish)}.` : `${first(id)}’s route is already optimal.`); } }];
    if (last) { const b = bestFit(last, id); if (b) sugg.push({ label: `Hand ${ORD[last].cust} over to ${first(b.tid)}`, run: () => { assign(last, b.tid, b.idx); dispatchRender(); status(`${esc(ORD[last].cust)} handed over to <b>${first(b.tid)}</b>. ${first(id)} is back at ${hm(sched(id).finish)}.`); } }); }
    if (s.stops.length) sugg.push({ label: `Send the day plan to ${first(id)}`, ext: true, run: () => sendDayPlan(id) });
    return { title: TECH[id].name, sub: `${s.stops.length} orders, back at ${hm(s.finish)}${s.overtime > 0.05 ? `, ${num(s.overtime, 1)} h overtime` : ''}`,
      direct: [{ label: D.collapsed[id] ? 'Expand lane' : 'Collapse lane', run: () => { D.collapsed[id] = !D.collapsed[id]; dispatchRender(); } }, { label: 'Show only this route on the map', run: () => { D.focus = id; dispatchRender(); } }], sugg, prompt: `What if ${first(id)} starts at 06:30?` };
  }
  if (kind === 'map' || kind === 'queue' || kind === 'timeline') {
    const sugg = [{ label: 'Assign all open orders', run: () => { const d = assignAllOpen(); dispatchRender(); status(d.length ? `Assigned ${d.length}: ${esc(d.join(', '))}.` : 'Nothing open, or no technician has the skills.'); } },
      { label: 'Optimise all routes', run: () => $('#d-opt').click() }];
    const direct = kind === 'map' ? [{ label: 'Zoom in', run: () => zoomMap(0.8) }, { label: 'Zoom out', run: () => zoomMap(1.25) }, { label: 'Fit to region', run: fitMap }]
      : kind === 'queue' ? [{ label: 'Sort by priority', run: () => { D.sort = 'prio'; dispatchRender(); } }, { label: 'Sort by duration', run: () => { D.sort = 'dur'; dispatchRender(); } }, { label: 'Sort by town', run: () => { D.sort = 'town'; dispatchRender(); } }]
      : TECHS.map((t) => ({ label: `${D.collapsed[t.id] ? 'Expand' : 'Collapse'} ${t.name.split(' ')[0]}`, run: () => { D.collapsed[t.id] = !D.collapsed[t.id]; dispatchRender(); } }));
    return { title: { map: 'Region north', queue: 'Open orders', timeline: 'Day timeline' }[kind], sub: kind === 'map' ? 'map Lumen' : kind === 'queue' ? `${D.queue.length} open` : '3 technicians', direct, sugg, prompt: kind === 'map' ? 'Add live traffic for the B12' : 'Plan tomorrow with the same team' };
  }
  if (kind === 'kpis') {
    const t = totals();
    return { title: 'Today’s figures', sub: `${t.open} open, ${num(t.km)} km, ${num(t.ot, 1)} h overtime`, direct: [{ label: 'Copy figures', run: () => { navigator.clipboard?.writeText(`${t.open} open, ${num(t.km)} km, ${num(t.ot, 1)} h overtime`).catch(() => {}); status('Figures copied.'); } }],
      sugg: [{ label: 'Rebalance to remove overtime', run: () => { const m = rebalance(); dispatchRender(); status(m.length ? `Rebalanced: ${esc(m.join(', '))}. Overtime now ${num(totals().ot, 1)} h.` : 'No overtime to remove, or no technician with the right skills has room.'); } },
        { label: 'Assign all open orders', run: () => { const d = assignAllOpen(); dispatchRender(); status(d.length ? `Assigned ${d.length}: ${esc(d.join(', '))}.` : 'Nothing open.'); } }], prompt: 'Compare with last Tuesday' };
  }
  if (kind === 'roof') {
    return { title: 'Roof layout', sub: `${calc().n} modules placed`, direct: [{ label: 'Paint tool', run: () => { P.tool = 'paint'; solarRender(); } }, { label: 'Erase tool', run: () => { P.tool = 'erase'; solarRender(); } }, { label: 'Clear roof', run: () => { P.panels.clear(); solarRender(); } }],
      sugg: [{ label: 'Fill the south face', run: () => fillFace('s') }, { label: 'Add the north face too, lower yield', run: () => fillFace('n') },
        { label: 'Clear the north face', run: () => { for (const k of [...P.panels]) if (k[0] === 'n') P.panels.delete(k); solarRender(); status('North face cleared.'); } },
        { label: P.margin ? 'Release the fire-safety margin' : 'Restore the fire-safety margin', run: () => setMargin(!P.margin) }], prompt: 'Can we route around the skylights?' };
  }
  if (kind === 'module' || kind === 'config') {
    return { title: 'Configuration', sub: `${MODS[P.module].name}, battery ${BATT[P.battery].name}`, direct: Object.entries(MODS).map(([k, m]) => ({ label: m.name, run: () => { P.module = k; solarRender(); } })),
      sugg: [{ label: 'Size the battery to the evening load', run: () => { P.battery = 'b15'; solarRender(); flash($('#s-metrics')); status('Battery set to <b>15 kWh</b>, sized from the hall’s evening load in the CRM report.'); } },
        { label: 'Cheapest price per kWp', run: () => { P.module = 'std'; solarRender(); status('Switched to the standard module, lowest price per kWp.'); } }], prompt: 'Which module ages best?' };
  }
  if (kind === 'quote') {
    return { title: 'Quote Q-2026-0412', sub: `${eur(calc().net)} net`, direct: [{ label: 'Copy as text', run: () => { const c = calc(); navigator.clipboard?.writeText(c.lines.map(([t, q, u]) => `${t}\t${q}\t${eur(q * u)}`).join('\n')).catch(() => {}); status('Quote copied as text.'); } }],
      sugg: [{ label: P.discount ? 'Remove the volume discount' : 'Apply 5 % volume discount', run: () => { P.discount = !P.discount; solarRender(); status(P.discount ? 'Volume discount applied.' : 'Discount removed.'); } },
        { label: 'Send quote to Müller GmbH', ext: true, run: sendQuote }], prompt: 'Add a maintenance contract for 5 years' };
  }
  if (kind === 'chart') return { title: 'Yield and demand', sub: 'per month', direct: [], sugg: [{ label: 'Size the battery to the evening load', run: () => { P.battery = 'b15'; solarRender(); status('Battery set to <b>15 kWh</b>.'); } }], prompt: 'Explain the summer surplus' };
  if (kind === 'kioskpane') return { title: 'Lobby kiosk', sub: 'kiosk Lumen', direct: [{ label: 'Open full screen', run: () => window.open('kiosk-lumen-aura.html', '_blank', 'noopener') }], sugg: [{ label: 'Push to lobby screen', ext: true, run: pushKiosk }], prompt: 'Add a German version' };
  if (kind === 'tool') return { title: META[id].short, sub: `pinned ${S.pinned[id]}`, direct: [{ label: 'Open', run: () => openTool(id) }, { label: 'Unpin', run: () => { delete S.pinned[id]; renderTools(); $$(`[data-pin="${id}"]`).forEach((b) => { b.textContent = 'Pin as tool'; }); status(`Unpinned <b>${esc(META[id].short)}</b>.`); } }], sugg: [], prompt: 'Share this tool with my team' };
  if (kind === 'tools') return { title: 'Your tools', sub: `${Object.keys(S.pinned).length} pinned`, direct: [], sugg: Object.keys(REQUESTS).filter((k) => !S.pinned[k]).map((k) => ({ label: `Generate ${META[k].short}`, run: () => generate(k) })), prompt: 'Make me a tool for weekly reporting' };
  return null;
}
let panelTarget = null;
function openPanel(target, at) {
  if (!target) return;
  const spec = ctxSpec(target.dataset.ctx); if (!spec) return;
  closePanel(); closeCmdk();
  panelTarget = target; target.classList.add('ctx-target');
  const p = el(`<div id="panel" role="dialog" aria-label="Actions for ${esc(spec.title)}">
    <div class="ph"><b>${esc(spec.title)}</b><span>${esc(spec.sub || '')}</span></div>
    ${spec.direct.length ? `<div class="zone"><div class="eyebrow">Direct <em>on this device</em></div>${spec.direct.map((a, i) => `<button class="act" data-d="${i}"><span>${esc(a.label)}</span></button>`).join('')}</div>` : ''}
    ${spec.sugg.length ? `<div class="zone"><div class="eyebrow">Suggested by omadia <em>prepared with this view</em></div>${spec.sugg.map((a, i) => `<button class="act" data-s="${i}"><span>${esc(a.label)}</span><span class="fx${a.ext ? ' ext' : ''}">${a.ext ? 'asks first' : ''}</span></button>`).join('')}</div>` : ''}
    <form class="beam" autocomplete="off"><input placeholder="Beam omadia about this…" aria-label="Beam omadia about this" /><button class="btn primary sm" type="submit">Beam</button></form>
    <button class="bhint" type="button">Try: “${esc(spec.prompt)}”</button>
  </div>`);
  document.body.appendChild(p);
  const r = target.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight, vw = innerWidth, vh = innerHeight;
  let x = r.right + 12; if (x + pw > vw - 8) x = r.left - pw - 12; if (x < 8) x = Math.min(Math.max(8, (at?.x ?? r.left) + 12), vw - pw - 8);
  let y = Math.min(Math.max(8, r.top), vh - ph - 8);
  if (r.width > vw * 0.45 && at) { x = Math.min(at.x + 14, vw - pw - 8); y = Math.min(Math.max(8, at.y - 20), vh - ph - 8); }
  p.style.left = x + 'px'; p.style.top = y + 'px';
  p.addEventListener('click', (e) => {
    const d = e.target.closest('[data-d]'), s = e.target.closest('[data-s]');
    if (d) { closePanel(); spec.direct[+d.dataset.d].run(); trace('Direct', `${esc(spec.title)}: ${esc(spec.direct[+d.dataset.d].label)}.`); }
    if (s) { const a = spec.sugg[+s.dataset.s]; closePanel(); if (!a.ext) trace('Suggestion', `${esc(spec.title)}: ${esc(a.label)}.`); a.run(); }
  });
  const inp = $('input', p);
  $('.bhint', p).onclick = () => { inp.value = spec.prompt; inp.focus(); };
  $('form', p).addEventListener('submit', (e) => { e.preventDefault(); beam(target, spec, inp.value.trim() || spec.prompt); });
}
function closePanel() { $('#panel')?.remove(); panelTarget?.classList.remove('ctx-target'); panelTarget = null; }
async function beam(target, spec, text) {
  closePanel();
  trace('Beam', `<b>${esc(spec.title)}</b>: “${esc(text)}”`);
  const words = text.toLowerCase().split(/\W+/).filter((w) => w.length > 3);
  const match = spec.sugg.find((s) => words.some((w) => s.label.toLowerCase().includes(w)));
  target.classList.add('beaming');
  const r = target.getBoundingClientRect();
  const chip = el(`<div class="beamchip">omadia is on it: “${esc(text.length > 46 ? text.slice(0, 44) + '…' : text)}”</div>`);
  chip.style.left = Math.min(r.left, innerWidth - 380) + 'px'; chip.style.top = Math.max(50, r.top - 36) + 'px';
  document.body.appendChild(chip);
  await wait(1600);
  target.classList.remove('beaming'); chip.remove();
  if (match) { match.run(); return; }
  status(`Beam to <b>${esc(spec.title)}</b> received. The real product patches this element now. In the mockup, the suggested actions are the scripted part.`);
}
document.addEventListener('contextmenu', (e) => {
  const t = e.target.closest('[data-ctx]'); if (!t || !booted) return;
  e.preventDefault(); openPanel(t, { x: e.clientX, y: e.clientY });
});
// long-press (400 ms, <= 6 px) on everything else with a context; tool zones never context-invoke
document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || !booted) return;
  if (e.target.closest('[data-order], #d-map, [data-toolzone], button, input, a, #panel, #cmdk, #modal')) return;
  const t = e.target.closest('[data-ctx]'); if (!t) return;
  const sx = e.clientX, sy = e.clientY;
  const lp = setTimeout(() => { done(); openPanel(t, { x: sx, y: sy }); }, 400);
  const mv = (ev) => { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) done(); };
  function done() { clearTimeout(lp); window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', done); }
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', done);
});
document.addEventListener('pointerdown', (e) => { if ($('#panel') && !e.target.closest('#panel')) closePanel(); }, true);

/* =========================================================================
   Consent for external effects
   ========================================================================= */
function consent({ title, text, items, confirm, verb }) {
  return new Promise((resolve) => {
    closePanel();
    const scrim = el('<div class="scrim"></div>');
    const m = el(`<div id="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="eyebrow">External effect, needs your OK</div><h2>${esc(title)}</h2><p>${esc(text)}</p>
      <ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
      <div class="foot"><button class="btn ghost" data-no>Cancel</button><button class="btn primary" data-yes>${esc(confirm)}</button></div></div>`);
    document.body.append(scrim, m);
    $('[data-yes]', m).focus();
    const close = (v) => { scrim.remove(); m.remove(); document.removeEventListener('keydown', key, true); resolve(v); };
    const key = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(false); } };
    document.addEventListener('keydown', key, true);
    scrim.onclick = () => close(false);
    $('[data-no]', m).onclick = () => close(false);
    $('[data-yes]', m).onclick = async (e) => {
      const b = e.currentTarget; b.disabled = true; $('[data-no]', m).disabled = true;
      for (let i = 0; i < 6; i++) { b.textContent = verb + '.'.repeat((i % 3) + 1); await wait(220); }
      close(true);
    };
  });
}

/* =========================================================================
   Command layer (Cmd/Ctrl+K)
   ========================================================================= */
const CMDS = () => [
  ...Object.entries(REQUESTS).map(([k, r]) => ({ label: r.text, hint: S.built[k] ? 'open' : S.pinned[k] ? 'tool' : 'generate', run: () => (S.built[k] ? switchTo(k) : generate(k, r.text)) })),
  { label: 'Make it warmer', hint: 'palette Atelier', run: () => setPalette('atelier', 'Make it warmer') },
  { label: 'Make it cooler', hint: 'palette Petrol', run: () => setPalette('petrol', 'Make it cooler') },
  { label: 'Back to Lagoon', hint: 'default palette', run: () => setPalette('lagoon', 'Back to Lagoon') },
  { label: 'Show what this canvas is made of', hint: 'X-ray', run: () => toggleXray() },
  { label: 'Open the Trace', hint: 'history', run: () => toggleTrace(true) },
  { label: 'Go to Home', hint: 'space', run: () => switchTo('home') },
  { label: 'Replay the boot', hint: 'thin client', run: () => location.reload() },
];
let cmdSel = 0;
function openCmdk() {
  if ($('#cmdk')) return; closePanel();
  const scrim = el('<div class="scrim" id="cmdk-scrim" style="background:rgba(10,24,30,.35)"></div>');
  const box = el('<div id="cmdk" role="dialog" aria-label="Command layer"><input placeholder="Ask omadia or run a command" aria-label="Ask omadia or run a command" /><ul></ul></div>');
  document.body.append(scrim, box);
  const inp = $('input', box); inp.focus();
  const list = () => { const q = inp.value.toLowerCase(); return CMDS().filter((c) => !q || c.label.toLowerCase().includes(q) || c.hint.includes(q)); };
  const draw = () => { const l = list(); cmdSel = Math.min(cmdSel, Math.max(0, l.length - 1));
    $('ul', box).innerHTML = l.map((c, i) => `<li class="${i === cmdSel ? 'on' : ''}" data-i="${i}">${esc(c.label)}<span>${c.hint}</span></li>`).join('') || `<li class="on">Ask: “${esc(inp.value)}”<span>enter</span></li>`; };
  draw();
  inp.addEventListener('input', () => { cmdSel = 0; draw(); });
  inp.addEventListener('keydown', (e) => {
    const l = list();
    if (e.key === 'ArrowDown') { cmdSel = Math.min(cmdSel + 1, l.length - 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { cmdSel = Math.max(cmdSel - 1, 0); draw(); e.preventDefault(); }
    if (e.key === 'Enter') { e.preventDefault(); const c = l[cmdSel]; const v = inp.value; closeCmdk(); if (c) c.run(); else { const r = route(v); if (r) submitPrompt(v); else status('This mockup scripts the requests listed in the command layer.'); } }
  });
  $('ul', box).addEventListener('click', (e) => { const li = e.target.closest('[data-i]'); if (li) { const c = list()[+li.dataset.i]; closeCmdk(); c.run(); } });
  scrim.onclick = closeCmdk;
}
function closeCmdk() { $('#cmdk')?.remove(); $('#cmdk-scrim')?.remove(); }
$('#btn-cmdk').onclick = openCmdk;
document.addEventListener('keydown', (e) => {
  if (!booted) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#cmdk') ? closeCmdk() : openCmdk(); }
  if (e.key === 'Escape') { closePanel(); closeCmdk(); closeGuide(); }
});

/* =========================================================================
   X-ray
   ========================================================================= */
const XBAR = {
  home: '<b>Home</b> is the only screen the thin client runs. There is no start menu and no installed application: each tool below the prompt is a generated application, stored as data.',
  dispatch: '<b>This application did not exist a minute ago.</b> 2 Lumens (map, schedule), 9 primitives, 3 wires. Data comes through omadia core from the ERP, HR and Maps plugins. Dragging, panning and selecting run on this device without a server round trip. Writing back asks you first.',
  solar: '<b>A roof editor, a configurator and a quote, generated from one site-visit report.</b> 1 Lumen with 112 paintable cells, 14 primitives, 4 wires into yield, price and quote. CRM, Drive and ERP plugins deliver the data. Sending writes to CRM and ERP, after your OK.',
  kiosk: '<b>The same runtime drives a public kiosk.</b> The Lumen picks brand colours for its own content, omadia chrome stays Lume. A gas budget stops a faulty Lumen cleanly, so an always-on screen never freezes.',
};
function renderXbar() { $('#xbar').innerHTML = XBAR[S.space] || ''; }
function toggleXray() {
  S.xray = !S.xray; document.body.classList.toggle('xray', S.xray);
  $('#btn-xray').setAttribute('aria-pressed', String(S.xray)); renderXbar();
  if (S.xray) trace('View', 'X-ray on.');
}
$('#btn-xray').onclick = toggleXray;
addEventListener('resize', () => { if (D && S.space === 'dispatch') renderCallout(); closePanel(); });

/* go */
const params = new URLSearchParams(location.search);
if (params.has('noboot')) { bootSkip = true; finishBoot(); } else boot();
})();
